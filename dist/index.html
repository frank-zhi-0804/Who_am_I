<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>来处 · 家族溯源</title><meta name="description" content="从姓名与祖籍出发，探索家族迁徙线索。交互演示，资料待核查。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23132029'/%3E%3Cpath d='M8 24V14l8-7 8 7v10M16 7v17M8 17h16' fill='none' stroke='%23e9b96e' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="vendor/maplibre-gl.css"><link rel="stylesheet" href="style.css"></head><body>
<header class="site-header"><a class="brand" href="./" aria-label="来处首页"><span class="seal">来</span><span>来处<small>家族历史地图</small></span></a><span class="header-note">一个名字，一段来路。</span><span class="tag" id="session-tag">对话探索</span></header>
<nav class="mobile-tabs" aria-label="探索视图"><button id="tab-chat" aria-selected="true" type="button">对话探索</button><button id="tab-map" aria-selected="false" type="button">历史地图 <span id="mobile-count">4</span></button></nav>
<main id="workspace" data-view="chat"><aside class="conversation-panel" aria-label="溯源助手"><div class="panel-top"><span class="eyebrow">你的来处，慢慢找</span><button id="reset-chat" class="quiet-button" type="button">新对话</button></div><div class="mode-control" role="group" aria-label="查询模式"><button id="mode-live" type="button" aria-pressed="false">真实溯源</button><button id="mode-demo" type="button" aria-pressed="true">体验示例</button></div><p id="service-notice" class="service-notice" role="status">正在检查溯源服务…</p>
<div class="thread-scroll" id="thread-scroll"><div id="welcome" class="welcome"><span class="welcome-mark" aria-hidden="true">来</span><h1>你想知道，<br>家里的哪件事？</h1><p>一个村名，一段字辈，<br>或长辈曾讲过的迁徙故事。</p></div><div id="conversation" role="log" aria-label="溯源对话" aria-live="polite"></div><div id="suggestions" class="suggestions" aria-label="继续探索"></div></div>
<div id="query-progress" class="query-progress" hidden role="status"><span class="loading-ring" aria-hidden="true"></span><span id="progress-text">正在查找公开资料…</span><button id="cancel-query" class="quiet-button" type="button">停止</button></div>
<form id="chat-form" class="composer"><label for="question" class="sr-only">你的家族溯源问题</label><textarea id="question" rows="2" maxlength="600" required placeholder="说说你的姓氏、祖籍，或想问的问题…"></textarea><div class="composer-bottom"><span id="input-hint">Enter 发送 · Shift + Enter 换行</span><button id="send-question" class="primary" type="submit">开始探索</button></div><p id="form-error" role="alert" hidden></p></form><p class="privacy-note">对话仅保留在当前页面，不自动公开到地图。</p></aside>
<section class="map-shell" aria-label="家族历史地图"><div id="map"></div><div class="map-top"><div><span class="eyebrow">家族历史地图</span><h2 id="map-heading">从家乡出发</h2></div><button id="overview" class="map-button" type="button">全部地点</button></div><div id="map-status" class="map-status" role="status">正在打开地图…</div><div class="map-caption"><span class="caption-line"></span><span id="route-caption">阮氏背景示例 · 不代表你的祖先</span></div><div id="map-toast" role="status" hidden></div>
<section class="history" id="history" hidden aria-label="地点详情"><div class="history-heading"><span id="era" class="step"></span><button id="close-history" class="quiet-button" type="button" aria-label="关闭地点详情">关闭</button></div><div class="location-heading"><h2 id="location-title"></h2><span id="location-evidence" class="evidence">待核查</span></div><p id="location-subtitle" class="location-subtitle"></p><p id="history-copy"></p><details><summary>资料出处与缺口</summary><div id="source-copy"></div></details><button id="ask-location" class="history-ask" type="button">继续问这个地方</button></section>
<nav class="timeline" aria-label="地图上的线索地点"><div class="timeline-label"><span id="timeline-title">先探索这些背景地点</span><span id="place-count">4 处线索</span></div><div id="stops"></div><p id="map-empty" hidden>找到有依据的地点后，会出现在这里。</p></nav><span class="map-instruction">点击地点探索 · 拖动与缩放地图</span></section></main>
<script src="vendor/maplibre-gl.js"></script><script src="geography.js"></script><script src="app.js"></script><script src="conversation.js"></script></body></html>
