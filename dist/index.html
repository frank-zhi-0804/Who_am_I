<main id="workspace" data-view="chat"><aside class="conversation-panel" aria-label="溯源助手"><div class="panel-top"><span class="eyebrow">从这里开始寻根</span><button id="reset-chat" class="quiet-button" type="button">新对话</button></div><div class="mode-control" role="group" aria-label="查询模式"><button id="mode-live" type="button" aria-pressed="false">真实溯源</button><button id="mode-demo" type="button" aria-pressed="true">体验示例</button></div><p id="service-notice" class="service-notice" role="status">正在检查溯源服务…</p>
